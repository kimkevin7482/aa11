name: Update stock prices

on:
  schedule:
    # 한국 장중(09:00~15:30 KST, UTC 00:00~06:30) 30분마다, 정각을 피해 7/37분에 실행
    - cron: "7,37 0-6 * * 1-5"
    # 미국 장중(23:30~06:00 KST, UTC 14:30~21:00) 30분마다, 정각을 피해 7/37분에 실행
    - cron: "7,37 14-20 * * 1-5"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch prices from Kiwoom REST API
        env:
          KIWOOM_APPKEY: ${{ secrets.KIWOOM_APPKEY }}
          KIWOOM_SECRETKEY: ${{ secrets.KIWOOM_SECRETKEY }}
        run: python scripts/fetch_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "chore: update prices.json [skip ci]"
          git push
